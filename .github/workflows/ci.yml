name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install linters
        run: pip install ruff bandit

      - name: Ruff (errores, imports, estilo)
        run: ruff check apps config --select E9,F,SIM,I001 --exclude "*/migrations/*"

      - name: Bandit (seguridad, media+alta severidad)
        run: bandit -r apps config -x "*/migrations/*,tests" -lll

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todolist_test
          POSTGRES_USER: todolist
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "1"
      # settings.py solo lee POSTGRES_* — DATABASE_URL/DB_* se ignoraban
      # y el migrate de CI apuntaba al host "db" (inexistente en Actions).
      POSTGRES_DB: todolist_test
      POSTGRES_USER: todolist
      POSTGRES_PASSWORD: testpass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings=9999

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npx vite build

  dependency-audit:
    name: Dependency & Secret Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: pip-audit (vulnerabilidades Python)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off \
            || echo "pip-audit reportó hallazgos — revisar antes de mergear"

      - name: npm audit (vulnerabilidades frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: gitleaks (secretos en el repo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"

  docs-check:
    name: Docs (markdownlint + enlaces)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: markdownlint
        run: npx -y markdownlint-cli2 "**/*.md" "!frontend/node_modules/**" "!backend/.venv/**"

      - name: enlaces rotos (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --exclude "localhost|127\.0\.0\.1" "**/*.md"
          fail: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t todolist-backend ./backend

      - name: Build frontend image
        run: docker build -t todolist-frontend ./frontend
