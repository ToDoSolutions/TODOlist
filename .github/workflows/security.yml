name: CI - Seguridad (secretos + dependencias)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Semanal: las CVEs nuevas afectan a lockfiles sin cambios
    - cron: '23 4 * * 1'

jobs:
  secrets:
    name: 'Escaneo de secretos (gitleaks)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Binario OSS fijado — gitleaks-action@v2 exige licencia de pago.
      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Escanear secretos
        run: ./gitleaks git --verbose --redact .

  pip-audit:
    name: 'Auditoría dependencias Python (backend)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      # Estricto sobre lo que se despliega (la imagen solo instala
      # requirements.txt). Las deps de test se auditan aparte sin
      # bloquear — schemathesis 3.x pinnea starlette<1 y sus CVEs no
      # tienen fix disponible sin una migración major.
      - run: pip-audit -r backend/requirements.txt
      - name: pip-audit deps de test (informativo)
        run: |
          pip-audit -r backend/requirements-test.txt --progress-spinner off \
            || echo "::warning::pip-audit sobre deps de test reportó hallazgos (no bloquea)"

  npm-audit:
    name: 'Auditoría dependencias npm (frontend)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
