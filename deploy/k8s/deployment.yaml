apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-backend
  namespace: todolist
  labels:
    app: todolist
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todolist
      component: backend
  template:
    metadata:
      labels:
        app: todolist
        component: backend
    spec:
      containers:
        - name: backend
          image: todolist-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: todolist-config
            - secretRef:
                name: todolist-secrets
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: todolist-backend
  namespace: todolist
spec:
  selector:
    app: todolist
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-frontend
  namespace: todolist
  labels:
    app: todolist
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todolist
      component: frontend
  template:
    metadata:
      labels:
        app: todolist
        component: frontend
    spec:
      containers:
        - name: frontend
          image: todolist-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: todolist-frontend
  namespace: todolist
spec:
  selector:
    app: todolist
    component: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: todolist
  labels:
    app: todolist
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todolist
      component: redis
  template:
    metadata:
      labels:
        app: todolist
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: todolist
spec:
  selector:
    app: todolist
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todolist-ingress
  namespace: todolist
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - todolist.example.com
      secretName: todolist-tls
  rules:
    - host: todolist.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: todolist-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist-frontend
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todolist-backend-hpa
  namespace: todolist
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todolist-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
