<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:20px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
          <!-- Header -->
          <tr>
            <td style="background:#1976d2;padding:20px 30px;">
              <h1 style="color:#ffffff;margin:0;font-size:22px;">TODOlist</h1>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:30px;">
              <h2 style="color:#333;margin:0 0 15px 0;font-size:18px;">{{ title }}</h2>
              <p style="color:#666;font-size:14px;line-height:1.6;">{{ body }}</p>
              {% if action_url %}
              <a href="{{ action_url }}" style="display:inline-block;background:#1976d2;color:#ffffff;text-decoration:none;padding:10px 25px;border-radius:5px;font-size:14px;margin-top:15px;">Ver detalle</a>
              {% endif %}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background:#f5f5f5;padding:15px 30px;border-top:1px solid #eee;">
              <p style="color:#999;font-size:12px;margin:0;text-align:center;">
                Recibes este email porque tienes activadas las notificaciones por email.<br>
                <a href="{{ settings_url|default:'#' }}" style="color:#1976d2;">Gestionar preferencias</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
